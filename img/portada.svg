    <circle r="244" class="hair"/>
    <circle r="168" class="hair"/>
    <circle r="88" class="fine"/>
    <g class="fine">
      <path d="M0-315V315M-315 0H315M-223-223L223 223M223-223L-223 223"/>
      <path d="M0-244V244M-244 0H244M-173-173L173 173M173-173L-173 173"/>
    </g>
