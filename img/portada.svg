  <text x="500" y="153" text-anchor="middle" class="sans" fill="#d5edc1" font-size="21" letter-spacing="3">M3856121</text>

  <line x1="160" y1="875" x2="840" y2="875" stroke="#a8dfbd" stroke-opacity=".5"/>
  <text x="500" y="970" text-anchor="middle" class="sans" fill="#f2f5e9" font-size="66" font-weight="500" letter-spacing="1">Biotecnología,</text>
