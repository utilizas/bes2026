      <path d="M0-42 C-82-88-124-152-93-205 C-38-192 0-133 0-42Z"/>
      <path d="M42 0 C88-82 152-124 205-93 C192-38 133 0 42 0Z" transform="rotate(45)"/>
      <path d="M0-42 C-82-88-124-152-93-205 C-38-192 0-133 0-42Z" transform="rotate(90)"/>
      <path d="M0-42 C-82-88-124-152-93-205 C-38-192 0-133 0-42Z" transform="rotate(180)"/>
      <path d="M0-42 C-82-88-124-152-93-205 C-38-192 0-133 0-42Z" transform="rotate(270)"/>
    </g>
    <circle r="18" fill="#d6eca5" fill-opacity=".9"/>
    <circle r="7" fill="#0b4f4b"/>
