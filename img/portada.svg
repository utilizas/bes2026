      <circle cx="315" cy="0" r="5"/><circle cx="223" cy="223" r="5"/>
      <circle cx="0" cy="315" r="5"/><circle cx="-223" cy="223" r="5"/>
      <circle cx="-315" cy="0" r="5"/><circle cx="-223" cy="-223" r="5"/>
    </g>
