<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1570" viewBox="0 0 1000 1570" role="img" aria-labelledby="title desc">
  <title id="title">Biotecnología, ética y sociedad — Miguel Moreno</title>
  <desc id="desc">Portada de monografía técnica, versión 5 de 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071d20"/>
      <stop offset="0.52" stop-color="#0b4f4b"/>
      <stop offset="1" stop-color="#063b3a"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#b6e2b0" stop-opacity=".18"/>
      <stop offset=".6" stop-color="#54b69a" stop-opacity=".06"/>
      <stop offset="1" stop-color="#0b4f4b" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <style>
      .sans { font-family: Inter, Avenir Next, Helvetica Neue, Arial, sans-serif; }
      .hair { fill:none; stroke:#8dd0b4; stroke-opacity:.55; stroke-width:2; }
      .fine { fill:none; stroke:#b9e5c0; stroke-opacity:.38; stroke-width:1.5; }
    </style>
  </defs>

  <rect width="1000" height="1570" fill="url(#bg)"/>
  <circle cx="500" cy="590" r="430" fill="url(#halo)" filter="url(#soft)"/>

  <!-- restrained editorial frame -->
  <path d="M72 72H928M72 1498H928" stroke="#9ad9bd" stroke-opacity=".34"/>
  <path d="M72 72V112M928 72V112M72 1458V1498M928 1458V1498" stroke="#9ad9bd" stroke-opacity=".34"/>

